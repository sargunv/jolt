[package]
name = "jolt_cli"
version = "0.20260721.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "jolt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-markdown = { version = "0.1.5", optional = true }
clap_complete = "4.5"
globset = "0.4"
ignore = "0.4"
jolt_config = { path = "../jolt_config", features = ["clap", "schema"] }
jolt_formatter = { path = "../jolt_formatter" }
rayon = "1.10"
schemars = { version = "0.8", default-features = false, features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"

[features]
# `jolt __cli-reference` prints the Markdown CLI reference for the docs site.
docs = ["dep:clap-markdown"]

[dev-dependencies]
insta = "1.48"
tempfile = "3.23"
