[workspace]
members = [
  "crates/jolt_cli",
  "crates/jolt_config",
  "crates/jolt_fmt",
  "crates/jolt_fmt_dprint",
  "crates/jolt_formatter",
  "crates/jolt_java_fmt",
  "crates/jolt_java_syntax",
  "crates/jolt_syntax",
  "crates/jolt_test_support",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sargunv/jolt"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
