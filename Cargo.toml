[workspace]
members = [
  # TEMPORARY: the formatter foundation restores "crates/jolt_cli",
  # "crates/jolt_fmt_dprint", "crates/jolt_formatter", "crates/jolt_java_fmt"
  # and "tools/bench/driver" once they follow the new syntax API.
  "crates/jolt_java_syntax",
  "crates/jolt_syntax",
  "crates/jolt_test_support",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sargunv/jolt"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
