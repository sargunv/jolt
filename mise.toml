[settings]
experimental = true
pin = true
minimum_release_age = "3d"
lockfile = true
# Overrides any global setting so `mise install` keeps every platform we ship from.
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-x64",
  "macos-arm64",
  "windows-x64",
]

[tools]
"aqua:dprint/dprint" = "0.54.0"
"aqua:WebAssembly/binaryen" = "130"
"aqua:jdx/hk" = "2.11.1"
"core:java" = "zulu-25.34.17.0"
"core:python" = "3.14.5"
"core:rust" = { version = "1.96.0", profile = "minimal", components = "rustfmt,clippy,llvm-tools", targets = "wasm32-unknown-unknown" }
"aqua:google/google-java-format" = "1.35.0"
"aqua:pnpm/pnpm" = "11.9.0"
"aqua:sharkdp/hyperfine" = "2.0.0"
"core:node" = "24.18.0"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-nextest" = "0.9.138"
"cargo:cargo-dist" = "0.32.0"

[deps.pnpm]
auto = true

[deps.cargo]
auto = true
sources = ["Cargo.lock", "**/Cargo.toml"]
run = "cargo fetch --locked"

[deps.imports]
auto = true
sources = ["tools/import/import.py"]
outputs = ["tools/import/.imports/manifest.json"]
run = "python tools/import/import.py"

[tasks.check]
description = "Run every check through hk"
run = "hk check --all"

[tasks.fix]
description = "Run every check and fixer through hk"
run = "hk fix --all"

[tasks.test]
description = "Run all tests"
usage = 'flag "--update" help="Update insta snapshots"'
run = 'INSTA_UPDATE="$([ "${usage_update:-false}" = "true" ] && printf always || printf no)" cargo nextest run --workspace'

[tasks.hunt]
description = "Sweep the fixtures and imported Java corpora for formatter bugs (idempotence, conservation, reparse validity); --mutate adds token deletions"
raw_args = true
run = "cargo run --release -p jolt_java_fmt --example jhunt --"

[tasks.jref]
description = "Compare formatter output with the reference outputs"
raw_args = true
run = "cargo run --release -p jolt_java_fmt --example jref --"

[tasks.jolt]
description = "Run the jolt CLI from local source"
raw_args = true
run = "cargo run -p jolt_cli --"

[tasks."dprint-with-jolt"]
description = "Run dprint with the local debug plugin"
depends = ["build:dprint-plugin"]
raw_args = true
run = "dprint --plugins=\"$PWD/target/wasm32-unknown-unknown/debug/jolt_fmt_dprint.wasm\""

[tasks.build]
depends = ["build:jolt", "build:dprint-plugin"]

[tasks."build:jolt"]
description = "Build the CLI; release mode is profile-guided (tools/pgo.py)"
usage = 'flag "--mode <mode>" default="debug" { choices "debug" "release" }'
run = '''
case "${usage_mode?}" in
  debug) cargo build --package jolt_cli ;;
  release) python tools/pgo.py ;;
esac
'''

[tasks."build:dprint-plugin"]
description = "Build the dprint plugin; release mode is optimized and smoke-tested (tools/wasm.sh)"
usage = 'flag "--mode <mode>" default="debug" { choices "debug" "release" }'
run = '''
case "${usage_mode?}" in
  debug) cargo build --target wasm32-unknown-unknown --package jolt_fmt_dprint ;;
  release) tools/wasm.sh ;;
esac
'''

[tasks.bench]
description = "Time formatting the Spring corpus (with --compare, against other formatters, writing docs/bench.json)"
usage = 'flag "--compare" help="Also time google-java-format and prettier-java"'
depends = ["build:jolt --mode release", "build:dprint-plugin --mode release"]
run = 'python tools/bench.py $([ "${usage_compare:-false}" = "true" ] && printf %s --compare)'

[tasks."docs:dev"]
depends = ["build:dprint-plugin --mode debug"]
run = "pnpm docs:dev"

[tasks."docs:build"]
depends = ["build:dprint-plugin --mode release"]
run = "pnpm docs:build"

[tasks."docs:preview"]
depends = ["build:dprint-plugin --mode release"]
run = "pnpm docs:preview"

[tasks."release:build"]
description = "Build the release archives for this host with cargo-dist"
run = '''
host=$(rustc -vV | sed -n 's/^host: //p')
case "$host" in
  aarch64-unknown-linux-gnu) target=aarch64-unknown-linux-musl ;;
  x86_64-unknown-linux-gnu) target=x86_64-unknown-linux-musl ;;
  aarch64-apple-darwin|x86_64-apple-darwin|aarch64-pc-windows-msvc|x86_64-pc-windows-msvc) target=$host ;;
  *) echo "unsupported release host: $host" >&2; exit 1 ;;
esac
dist build --target "$target"
'''

[tasks."release:cut"]
description = "Bump versions, commit, tag, and push a release"
run = '''
set -eu
today=$(date -u +%Y%m%d)
latest=$(git tag -l "0.$today.*" | sort -V | tail -1)
if [ -n "$latest" ]; then
  n=$(( ${latest##*.} + 1 ))
else
  n=0
fi
version="0.$today.$n"
tag="$version"

echo "About to cut $tag"
echo "  - bump native, plugin, and dist package manifests to $version"
echo "  - sync Cargo.lock"
echo "  - git commit -m \"chore: release jolt $version\""
echo "  - git tag -m \"jolt $version\" $tag"
echo "  - git push --atomic origin HEAD $tag"
printf "Proceed? [y/N] "
read -r reply
case "$reply" in
  y|Y|yes|YES) ;;
  *) echo "Aborted"; exit 1 ;;
esac

for toml in crates/jolt_cli/Cargo.toml crates/jolt_fmt_dprint/Cargo.toml dist/jolt/dist.toml; do
  awk -v v="$version" '/^version = / && !done { print "version = \"" v "\""; done=1; next } { print }' "$toml" > "$toml.tmp" && mv "$toml.tmp" "$toml"
done
cargo metadata --format-version=1 >/dev/null

git add crates/jolt_cli/Cargo.toml crates/jolt_fmt_dprint/Cargo.toml dist/jolt/dist.toml Cargo.lock
git commit -m "chore: release jolt $version"
git tag -m "jolt $version" "$tag"
git push --atomic origin HEAD "$tag"

echo "Released $tag"
'''

[hooks]
postinstall = ["hk install --mise"]
